name: CI/CD - Despliegue del modelo

# El pipeline corre en cada push a dev o prod. El ambiente (y su endpoint) se
# deriva del nombre de la rama: dev -> puerto 8501, prod -> puerto 8502.
on:
  push:
    branches: [dev, prod]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mlops-predictor   # repositorio de imágenes en ECR

jobs:
  # ───────────────────────────── ETAPA 1: TEST ─────────────────────────────
  test:
    name: Pruebas del modelo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # El modelo y los datos de prueba NO están en el repo: se bajan de S3.
      - name: Descargar modelo y datos de prueba desde S3
        env:
          MODEL_S3_URI: ${{ vars.MODEL_S3_URI }}
          BASELINE_S3_URI: ${{ vars.BASELINE_S3_URI }}
          TESTDATA_S3_URI: ${{ vars.TESTDATA_S3_URI }}
        run: bash scripts/download_artifacts.sh

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r requirements-test.txt

      - name: Ejecutar pruebas unitarias del modelo
        run: pytest -v

  # ──────────────────────── ETAPA 2: BUILD / PROMOTE ───────────────────────
  build-deploy:
    name: Construir imagen y desplegar
    needs: test                       # solo si las pruebas pasaron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determinar ambiente y puerto (según la rama)
        id: env
        run: |
          ENV_NAME="${GITHUB_REF_NAME}"
          if [ "$ENV_NAME" = "prod" ]; then PORT=8502; else PORT=8501; fi
          echo "name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # El modelo se obtiene de S3 para hornearlo en la imagen durante el build.
      - name: Descargar modelo desde S3
        env:
          MODEL_S3_URI: ${{ vars.MODEL_S3_URI }}
          BASELINE_S3_URI: ${{ vars.BASELINE_S3_URI }}
        run: bash scripts/download_artifacts.sh

      - name: Construir y publicar la imagen en ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$ENV_NAME-${GITHUB_SHA::7}"
          IMAGE_LATEST="$REGISTRY/$ECR_REPOSITORY:$ENV_NAME-latest"
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> "$GITHUB_ENV"

      # Despliegue en la instancia EC2: actualiza el contenedor del ambiente.
      # La EC2 usa un IAM instance role con permisos de ECR (pull) y S3 (logs),
      # por eso no se le pasan credenciales por SSH.
      - name: Desplegar en EC2 (actualizar el endpoint)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_LATEST
          script: |
            ENV_NAME="${{ steps.env.outputs.name }}"
            PORT="${{ steps.env.outputs.port }}"
            REGION="${{ env.AWS_REGION }}"
            REGISTRY="${{ steps.ecr.outputs.registry }}"
            LOG_BUCKET="${{ vars.LOG_BUCKET }}"

            aws ecr get-login-password --region "$REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$IMAGE_LATEST"
            docker rm -f "predictor-$ENV_NAME" 2>/dev/null || true
            docker run -d --restart unless-stopped \
              --name "predictor-$ENV_NAME" \
              -p "$PORT:8501" \
              -e APP_ENV="$ENV_NAME" \
              -e LOG_BUCKET="$LOG_BUCKET" \
              -e AWS_REGION="$REGION" \
              "$IMAGE_LATEST"
            docker image prune -f
